name: TimesUp
targets:
  TimesUp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TimesUp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.timesup.alarm
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_FILE: TimesUp/Info.plist
      DEVELOPMENT_TEAM: ""
    info:
      path: TimesUp/Info.plist
      properties:
        UILaunchScreen: {}
